<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <h1>Welcome to The Corner Table!</h1>

    <h2>User Information</h2>
    <p>Welcome, <span id="username">Guest</span>!</p>

    <a href="filter.html"><h2></h2></a>

    <h2>Database Tables</h2>
    <button onclick="FetchUserInfoTable()">Load User Info Table</button>
    <div id="userInfoTableResponse">
        <!-- User info table will be displayed here -->
    </div>

    <h2>Rate and Review</h2>
    <form id="rateAndReviewForm" onsubmit="SubmitRatingReview(event)" style="display: none;">
        <label for="tableUsername">User to Rate:</label>
        <input type="text" id="tableUsername" name="tableUsername" readonly>
        <br><br>
        <label for="rating">Rating (1-5):</label>
        <input type="number" id="rating" name="rating" min="1" max="5" required>
        <br><br>
        <label for="review">Review:</label>
        <textarea id="review" name="review" required></textarea>
        <br><br>
        <input type="submit" value="Submit">
    </form>

    <h2>Reviews</h2>
    <div id="reviewsResponse">
        <!-- Reviews will be displayed here -->
    </div>

    <h2>Logout</h2>
    <button onclick="SendLogoutRequest()">Logout</button>

    <script>
        // Handle server responses
        function HandleResponse(response) {
            try {
                console.log("Server Response: ", response);
                var text = JSON.parse(response);

                if (text.status === "success" && text.redirect) {
                    // Redirect if needed
                    window.location.href = text.redirect;
                } else {
                    document.getElementById("userInfoTableResponse").innerHTML = "Response: " + text.message + "<p>";
                }
            } catch (e) {
                document.getElementById("userInfoTableResponse").innerHTML = "Error parsing response: " + e.message + "<p>" + response;
            }
        }

        // Fetch user info table
        function FetchUserInfoTable() {
            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleUserInfoTableResponse(request.responseText);
                }
            };

            var fetchUserInfoRequest = {
                type: "fetch_user_info"  // Specify the request type for fetching user info
            };

            request.send(JSON.stringify(fetchUserInfoRequest));
        }

        // Handle the response for fetching user info table
        function HandleUserInfoTableResponse(response) {
            try {
                var data = JSON.parse(response);

                if (data.status === "success") {
                    var users = data.users;
                    var html = "<h3>User Info Table:</h3><table border='1'><tr><th>ID</th><th>Username</th><th>Created At</th><th>Action</th></tr>";

                    users.forEach(function (user) {
                        html += `<tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.created_at}</td>
                            <td><button onclick="SelectUserForReview('${user.username}')">Rate and Review</button></td>
                        </tr>`;
                    });

                    html += "</table>";
                    document.getElementById("userInfoTableResponse").innerHTML = html;
                } else {
                    document.getElementById("userInfoTableResponse").innerHTML = "Error: " + data.message;
                }
            } catch (e) {
                document.getElementById("userInfoTableResponse").innerHTML = "Error parsing response: " + e.message + "<p>" + response;
            }
        }

        // Function to select a user for review
        function SelectUserForReview(username) {
            // Set the selected user in the form
            document.getElementById("tableUsername").value = username;
            document.getElementById("rateAndReviewForm").style.display = "block"; // Show the form
        }

        // Submit a rating and review
        function SubmitRatingReview(event) {
            event.preventDefault();

            var rating = document.getElementById("rating").value;
            var review = document.getElementById("review").value;
            var tableUsername = document.getElementById("tableUsername").value; // Get the selected user from the form
            var username = sessionStorage.getItem('username'); // Get the logged-in user's username from sessionStorage

            if (!username) {
                alert("You must be logged in to submit a review.");
                return;
            }

            console.log("Submitting review with data:", {
                type: "submit_rating_review",
                user_id: username, // Use the logged-in user's username
                table_id: tableUsername, // Use the selected user's username as table_id
                rating: rating,
                review: review
            });

            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleResponse(request.responseText);
                    FetchRatingsReviews(tableUsername); // Refresh reviews after submission
                }
            };

            var submitReviewRequest = {
                type: "submit_rating_review",
                user_id: username, // Use the logged-in user's username
                table_id: tableUsername, // Use the selected user's username as table_id
                rating: rating,
                review: review
            };

            request.send(JSON.stringify(submitReviewRequest));
        }

        // Fetch ratings and reviews for a specific user
        function FetchRatingsReviews(tableUsername) {
            console.log("Fetching reviews for user:", tableUsername);

            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleRatingsReviewsResponse(request.responseText);
                }
            };

            var fetchReviewsRequest = {
                type: "fetch_ratings_reviews",
                table_id: tableUsername // Use the selected user's username as table_id
            };

            request.send(JSON.stringify(fetchReviewsRequest));
        }

        // Handle the response for fetching ratings and reviews
        function HandleRatingsReviewsResponse(response) {
            try {
                var data = JSON.parse(response);

                if (data.status === "success") {
                    var reviews = data.reviews;
                    var html = "<h3>Reviews:</h3><ul>";

                    reviews.forEach(function (review) {
                        html += `<li><strong>${review.username}</strong> (Rating: ${review.rating}) - ${review.review} <em>(${review.created_at})</em></li>`;
                    });

                    html += "</ul>";
                    document.getElementById("reviewsResponse").innerHTML = html;
                } else {
                    document.getElementById("reviewsResponse").innerHTML = "Error: " + data.message;
                }
            } catch (e) {
                document.getElementById("reviewsResponse").innerHTML = "Error parsing response: " + e.message + "<p>" + response;
            }
        }

        // Logout function
        function SendLogoutRequest() {
            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            var logoutRequest = {
                type: "logout"
            };

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    var response = JSON.parse(request.responseText);
                    if (response.status === "success") {
                        // Redirect to login page after successful logout
                        window.location.href = "index.html";
                    }
                }
            };

            request.send(JSON.stringify(logoutRequest));
        }
    </script>
</body>
</html>
