<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Booking Reservation</title>
</head>
<body>
   <h2>Booking Reservation</h2>
   <p>Welcome to the reservation system.</p>


   <h3>Enter Your Reservation Details</h3>
   <form action="confirmation.html" method="get">
       <label for="restaurant">Restaurant Name:</label>
       <input type="text" id="restaurant" name="restaurant" required><br><br>


       <label for="date">Date:</label>
       <input type="date" id="date" name="date" required><br><br>


       <label for="time">Time:</label>
       <input type="time" id="time" name="time" required><br><br>


       <button type="submit">Book Reservation</button>
   </form>
</body>
</html>
