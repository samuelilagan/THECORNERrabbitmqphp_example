<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Filter</title>
    <script>

        // Handle server responses
        function HandleFilterResponse(response) {
            try {
                var data = JSON.parse(response);

                if (data.status === "success") {
                    var users = data.users;
                    var html = "<h3>Recommendations:</h3><table border='1'><tr><th>Place Name</th><th>Place Address</th><th>Review Rating</th><th>Author Name</th></tr>";

                    users.forEach(function (user) {
                        html += `<tr>
                            <td>${reviews.placeName}</td>
                            <td>${reviews.placeAddress}</td>
                            <td>${reviews.reviewRating}</td>
                            <td>${reviews.authorName}</td>
                        </tr>`;
                    });

                    html += "</table>";
                    document.getElementById("textResponse").innerHTML = html;
                } else {
                    document.getElementById("textResponse").innerHTML = "Error: " + data.message;
                }
            } catch (e) {
                document.getElementById("textResponse").innerHTML = "Error parsing response: " + e.message + "<p>" + response;
            }
        }

        // Send filter request
        function SendFilterRequest(event) {
            event.preventDefault(); // Prevent the default form submission

            var city = document.getElementById("city").value;
            var keyword = document.getElementById("keyword").value;
            var rating = document.getElementsByName("rating").value;

            var filterRequest = {
                type: "filter",  // Specify the request type for registration
                city: city,
                keyword: keyword,
                rating: rating
            };

            var request = new XMLHttpRequest();
            request.open("POST", "filterhandle.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleFilterResponse(request.responseText);
                }
            };

            request.send(JSON.stringify(filterRequest));
        }


    </script>
</head>
<body>
    <h1>The Corner Table</h1>
    
    <h2>Filter for Restaurants</h2>
    <form onsubmit="SendFilterRequest(event)">
        <label for="city">City: </label>
        <input type="text" id="city" name="city" required>
        <br><br>
        <label for="keyword">Keyword: </label>
        <input type="text" id="keyword" name="keyword" required>
        <p>Minimum Rating: </p>
        <input type="radio" id="one" name="rating" value="1">
        <label for="one">1  </label>
        <input type="radio" id="two" name="rating" value="2">
        <label for="two">2  </label>
        <input type="radio" id="three" name="rating" value="3">
        <label for="three">3  </label>
        <input type="radio" id="four" name="rating" value="4">
        <label for="four">4  </label>
        <input type="radio" id="five" name="rating" value="5">
        <label for="five">5  </label>
        <br>
        <input type="submit" value="Filter">
    </form>
    <br>

    <!-- <h2>Session Validation</h2>
    <button onclick="CheckSession()">Check if Logged In</button> -->

    <div id="textResponse">
        Awaiting response...
    </div>
</body>
</html>
