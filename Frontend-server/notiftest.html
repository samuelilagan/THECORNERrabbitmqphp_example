 <br><h2>Want to be notified for your reservation? Input your email and Cellphone # Below!</h2>

<form id="notifForm">
 Cell-Phone #: <input type="text" id="number" name="number"> <br><br>
 Email: <input type="text" id="email" name="email"> <br><br>
 <button type="submit">Run Script</button>
</form>


<script>
 document.getElementById("notifForm").addEventListener("submit", function (e) {
   e.preventDefault(); // Stop the normal form submission

   const number = document.getElementById("number").value;
   const email = document.getElementById("email").value;

   fetch("/submit", {
     method: "POST",
     headers: {
       "Content-Type": "application/json",
     },
     body: JSON.stringify({ number, email }),
   })
   .then((res) => res.json())
   .then((data) => {
     if (data.status === "success") {
       window.location.href = "notiflanding.html"; // ✅ Redirect
     } else {
       alert("Something went wrong.");
     }
   })
   .catch((err) => {
     console.error(err);
     alert("Failed to send notification.");
   });
 });
</script>


<div class="col-sm-6" class="pagetitle">
  <h2>Logout</h2>
</div>
 <button onclick="logout()">Logout</button>

 <script>
     // Logout function hi
     function logout() {
         var request = new XMLHttpRequest();
         request.open("POST", "login.php", true);
         request.setRequestHeader("Content-Type", "application/json");

         var logoutRequest = {
             type: "logout"
         };

         request.onreadystatechange = function() {
             if (request.readyState == 4 && request.status == 200) {
                 var response = JSON.parse(request.responseText);
                 if (response.status === "success") {
                     // Redirect to login page after successful logout
                     window.location.href = "index.html";
                 }
             }
         };
         request.send(JSON.stringify(logoutRequest));
     }
 </script>
