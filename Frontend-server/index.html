<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="slicknav.css">
    <link rel="stylesheet" href="corner.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="jquery.slicknav.min.js"></script>
    <title>The Corner Table</title>
    <script>
        // Handle server responses
        function HandleLoginResponse(response) {
            try {
                console.log("Login response:", response); // Log the raw response
                var text = JSON.parse(response);

                if (text.status === "success" && text.redirect) {
                    console.log("Storing sessionToken and username:", text.sessionToken, text.username); // Log the values being stored
                    sessionStorage.setItem('sessionToken', text.sessionToken);
                    sessionStorage.setItem('username', text.username); // Store the username
                    window.location.href = text.redirect;
                } else {
                    document.getElementById("textResponse").innerHTML = "Response: " + text.message + "<p>";
                }
            } catch (e) {
                document.getElementById("textResponse").innerHTML = "Error parsing response: " + e.message + "<p>" + response;
            }
        }

        // Send login request
        function SendLoginRequest(event) {
            event.preventDefault(); // Prevent the default form submission

            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            var loginRequest = {
                type: "login",  // Specify the request type
                username: username,
                password: password
            };

            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleLoginResponse(request.responseText);
                }
            };

            request.send(JSON.stringify(loginRequest));
        }

        // Send registration request
        function SendRegistrationRequest(event) {
            event.preventDefault(); // Prevent the default form submission

            var username = document.getElementById("regUsername").value;
            var password = document.getElementById("regPassword").value;

            var registerRequest = {
                type: "register",  // Specify the request type for registration
                username: username,
                password: password
            };

            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleLoginResponse(request.responseText);
                }
            };

            request.send(JSON.stringify(registerRequest));
        }

        // Send logout request
        function SendLogoutRequest() {
            var logoutRequest = {
                type: "logout"  // Specify the request type for logout
            };

            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    HandleLoginResponse(request.responseText);
                }
            };

            request.send(JSON.stringify(logoutRequest));
        }
    </script>
</head>
<body>
    <h1>The Corner Table</h1>
    
    <h2>Login</h2>
    <form onsubmit="SendLoginRequest(event)">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Login">
    </form>

    <h2>Registration</h2>
    <form onsubmit="SendRegistrationRequest(event)">
        <label for="regUsername">Username:</label>
        <input type="text" id="regUsername" name="username" required>
        <br><br>
        <label for="regPassword">Password:</label>
        <input type="password" id="regPassword" name="password" required>
        <br><br>
        <input type="submit" value="Register">
    </form>

    <h2>Logout</h2>
    <button onclick="SendLogoutRequest()">Logout</button>

    <div id="textResponse">
        Awaiting response...
    </div>
</body>
</html>
