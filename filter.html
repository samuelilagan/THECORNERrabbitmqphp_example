   <title>Preference Filter</title>
   <script>
       // Handle server responses
       function HandleFilterResponse(response) {
           try {
               var data = JSON.parse(response);
               console.log(data); // Debugging: Log the parsed data


               if (data.status === "success") {
                   var reviews = data.reviews;
                   var html = "<h3>Recommendations:</h3><table border='1'><tr><th>Place Name</th><th>Place Address</th><th>Review Rating</th><th>Author Name</th></tr>";


                   reviews.forEach(function (review) {
                       html += `<tr>
                           <td>${review.placeName}</td>
                           <td>${review.placeAddress}</td>
                           <td>${review.reviewRating}</td>
                           <td>${review.authorName}</td>
                       </tr>`;
                   });


                   html += "</table>";
                   document.getElementById("reviewsResponse").innerHTML = html;
               } else {
                   document.getElementById("textResponse").innerHTML = "Error: " + data.message;
               }
           } catch (e) {
               document.getElementById("textResponse").innerHTML = "Error parsing response: " + e.message + "<p>" + response;
           }
       }


       // Send filter request
       function SendFilterRequest(event) {
           event.preventDefault(); // Prevent the default form submission


           var city = document.getElementById("city").value;
           var keyword = document.getElementById("keyword").value;
           var rating = document.querySelector('input[name="rating"]:checked');
           rating = rating ? rating.value : null; // Handle case where no rating is selected


           // Get dietary and cuisine preferences
           var dietary = document.getElementById("dietary").value;
           var cuisine = document.getElementById("cuisine").value;


           var filterRequest = {
               type: "filter",  // Specify the request type for registration
               city: city,
               keyword: keyword,
               rating: rating,
               dietary: dietary,
               cuisine: cuisine
           };


           var request = new XMLHttpRequest();
           request.open("POST", "filterhandle.php", true);
           request.setRequestHeader("Content-Type", "application/json");


           request.onreadystatechange = function () {
               if (request.readyState == 4 && request.status == 200) {
                   HandleFilterResponse(request.responseText);
               }
           };


           request.send(JSON.stringify(filterRequest));
       }

       // Logout function
       function SendLogoutRequest() {
            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            var logoutRequest = {
                type: "logout"
            };

            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    var response = JSON.parse(request.responseText);
                    if (response.status === "success") {
                        // Redirect to login page after successful logout
                        window.location.href = "index.html";
                    }
                }
            };

            request.send(JSON.stringify(logoutRequest));
        }
   </script>

       <label for="city">City: </label>
       <input type="text" id="city" name="city">
       <br><br>
       <label for="keyword">Keyword: </label>
       <input type="text" id="keyword" name="keyword">
       <p>Minimum Rating: </p>
       <input type="radio" id="one" name="rating" value="1">
       <label for="one">1  </label>
       <input type="radio" id="two" name="rating" value="2">
       <label for="two">2  </label>

       <label for="five">5  </label>
       <br><br>
       <label for="dietary">Dietary Restrictions: </label>
       <select id="dietary" name="dietary">

       </select>
       <br><br>
       <label for="cuisine">Cuisine: </label>

           <option value="american">American</option>
           <option value="french">French</option>
           <option value="spanish">Spanish</option>
           <option value="dessert">Dessert</option>
       </select>
       <br><br>
       <input type="submit" value="Filter">
   </form>
